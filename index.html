<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Invitation de mariage</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Great+Vibes&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            font-family: 'Cormorant Garamond', serif;
        }

        body {
            overflow: hidden;
        }

        /* PAGE APRÈS L'OUVERTURE */

        .page-content {
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
            background: #f8f3f5;
            color: #652c43;
            text-align: center;
        }

        /* COUVERTURE */

        .opening-screen {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            z-index: 9999;
            overflow: hidden;
            cursor: pointer;
            background: #30070f;
            perspective: 1400px;
        }

        /* IMAGE EN DEUX PARTIES */

        .opening-photo {
            position: absolute;
            top: 0;
            width: 50%;
            height: 100%;
            background-image: url("logo3.jpg");
            background-repeat: no-repeat;
            background-size: 200% 100%;
            transition: transform 3.5s cubic-bezier(.77, 0, .18, 1);
            will-change: transform;
            backface-visibility: hidden;
        }

        .opening-photo.left {
            left: 0;
            background-position: left center;
            transform-origin: left center;
        }

        .opening-photo.right {
            right: 0;
            background-position: right center;
            transform-origin: right center;
        }

        /* VOILE DISCRET */

        .cover-shade {
            position: absolute;
            inset: 0;
            z-index: 2;
            pointer-events: none;
            background: linear-gradient(
                    to bottom,
                    rgba(35, 0, 8, 0.30) 0%,
                    transparent 25%,
                    transparent 72%,
                    rgba(35, 0, 8, 0.38) 100%
            );
        }

        /* TEXTE DE LA COUVERTURE */

        .cover-content {
            position: absolute;
            inset: 0;
            z-index: 3;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: clamp(34px, 7vh, 75px) 20px;
            text-align: center;
            color: #e8c88e;
            pointer-events: none;
        }

        .cover-top,
        .cover-bottom {
            width: 100%;
            max-width: 600px;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.55);
        }

        /* TEXTE DU HAUT */

        .cover-kicker {
            font-size: clamp(10px, 1.5vw, 13px);
            font-weight: 500;
            letter-spacing: 0.32em;
            text-transform: uppercase;
            margin-bottom: 18px;
        }

        .cover-title {
            font-size: clamp(27px, 5vw, 49px);
            line-height: 1.05;
            font-weight: 400;
            letter-spacing: 0.035em;
        }

        .cover-subtitle {
            margin-top: 13px;
            font-size: clamp(14px, 2.2vw, 20px);
            font-weight: 300;
            letter-spacing: 0.10em;
        }

        .cover-divider {
            width: 65px;
            height: 1px;
            margin: 22px auto 0;
            background: #d8b475;
            opacity: 0.9;
        }

        /* TEXTE DU BAS */

        .cover-date {
            font-size: clamp(24px, 4vw, 38px);
            font-weight: 400;
            letter-spacing: 0.06em;
        }

        .cover-hint {
            margin-top: 24px;
            font-size: 10px;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            opacity: 0.85;
        }

        /* ANIMATION D'OUVERTURE */

        .opening-screen.opening .opening-photo.left {
            transform: rotateY(-105deg);
        }

        .opening-screen.opening .opening-photo.right {
            transform: rotateY(105deg);
        }

        .opening-screen.opening .cover-content,
        .opening-screen.opening .cover-shade {
            opacity: 0;
            transition: opacity 0.35s ease;
        }

        /* MOBILE : TEXTE DU HAUT PLUS BAS,
           TEXTE DU BAS PLUS HAUT */

        @media (max-width: 767px) {
            .opening-photo {
                background-size: 200% 100%;
            }

            .cover-content {
                padding: 9vh 16px 12vh;
            }

            .cover-top {
                transform: translateY(12px);
            }

            .cover-bottom {
                transform: translateY(-34px);
            }

            .cover-kicker {
                letter-spacing: 0.23em;
                margin-bottom: 13px;
            }

            .cover-title {
                font-size: clamp(27px, 7vw, 38px);
            }

            .cover-subtitle {
                font-size: 16px;
            }

            .cover-divider {
                margin-top: 16px;
            }

            .cover-hint {
                margin-top: 18px;
                font-size: 9px;
                letter-spacing: 0.16em;
            }
        }

        /* PETITS ÉCRANS EN HAUTEUR */

        @media (max-height: 650px) {
            .cover-content {
                padding-top: 22px;
                padding-bottom: 22px;
            }

            .cover-top {
                transform: translateY(8px);
            }

            .cover-bottom {
                transform: translateY(-12px);
            }

            .cover-kicker {
                margin-bottom: 8px;
            }

            .cover-divider {
                margin-top: 12px;
            }

            .cover-hint {
                margin-top: 12px;
            }
        }

        /* ACCESSIBILITÉ */

        @media (prefers-reduced-motion: reduce) {
            .opening-photo {
                transition-duration: 0.3s;
            }
        }
    </style>
</head>

<body>

<!-- COUVERTURE -->

<div class="opening-screen" id="openingScreen">
    <div class="opening-photo left"></div>
    <div class="opening-photo right"></div>

    <div class="cover-shade"></div>

    <div class="cover-content">

        <!-- TEXTE EN HAUT -->

        <div class="cover-top">
            <p class="cover-kicker">C'est un grand jour</p>

            <h1 class="cover-title">
                Vous êtes invités
            </h1>

            <p class="cover-subtitle">
                au mariage de Noa &amp; Eitan
            </p>

            <div class="cover-divider"></div>
        </div>

        <!-- TEXTE EN BAS -->

        <div class="cover-bottom">
            <p class="cover-date">
                25 janvier 2027
            </p>

            <p class="cover-hint">
                <br>
                Touchez pour ouvrir l'invitation
            </p>
        </div>

    </div>
</div>

<!-- PAGE APRÈS L'OUVERTURE -->

<main class="page-content">
    <div>
        <h1>Notre invitation</h1>
        <p>Bienvenue à notre mariage ❤️</p>
    </div>
</main>

<script>
    const openingScreen = document.getElementById("openingScreen");
    let isOpening = false;

    openingScreen.addEventListener("click", () => {
        if (isOpening) return;

        isOpening = true;
        openingScreen.classList.add("opening");

        setTimeout(() => {
            openingScreen.remove();
            document.body.style.overflow = "auto";
        }, 3600);
    });
</script>

</body>
</html>
